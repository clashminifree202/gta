<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f0f0f; color: #f1f1f1; font-family: Roboto, Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }

  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px;
    height: 56px; padding: 0 16px;
    background: #0f0f0f;
  }
  .menu-btn { color: #fff; font-size: 18px; cursor: pointer; background: none; border: none; padding: 8px; }
  .logo { display: flex; align-items: center; gap: 2px; font-weight: 600; letter-spacing: -1px; }
  .logo .play {
    width: 30px; height: 21px; border-radius: 6px; background: #ff0000; position: relative;
  }
  .logo .play::after {
    content: ''; position: absolute; left: 11px; top: 5px;
    border-left: 9px solid #fff; border-top: 5px solid transparent; border-bottom: 5px solid transparent;
  }
  .logo span { font-size: 20px; }
  .logo .country { display: inline-block; font-size: 10px; color: #aaa; margin-top: -8px; vertical-align: top; }

  .search-wrap { flex: 1; display: flex; justify-content: center; }
  .search-box { display: flex; width: min(560px, 100%); height: 40px; border: 1px solid #303030; border-radius: 20px 0 0 20px; overflow: hidden; background: #121212; }
  .search-box input {
    flex: 1; border: none; outline: none; background: transparent; color: #f1f1f1;
    font-size: 16px; padding: 0 16px;
  }
  .search-box input::placeholder { color: #888; }
  .search-btn {
    width: 64px; border: none; cursor: pointer; background: #222; color: #fff; font-size: 16px;
    border-left: 1px solid #303030;
  }
  .mic-btn {
    width: 40px; height: 40px; margin-left: 8px; border-radius: 50%; border: none;
    background: #181818; color: #fff; font-size: 15px; cursor: pointer;
  }
  .header-icons { display: flex; align-items: center; gap: 14px; color: #fff; font-size: 18px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #ff5f6d, #ffc371); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }

  .chips { display: flex; gap: 10px; padding: 12px 24px; overflow-x: auto; }
  .chip {
    white-space: nowrap; padding: 7px 12px; border-radius: 8px; font-size: 14px;
    background: #272727; color: #f1f1f1; cursor: pointer;
  }
  .chip.active { background: #f1f1f1; color: #0f0f0f; }

  main { padding: 0 24px 40px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 32px 16px; max-width: 1800px; margin: 0 auto;
  }
  .card { cursor: pointer; }
  .thumb {
    position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden;
    background-size: cover; background-position: center;
  }
  .thumb .playicon {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0); transition: background .15s; color: transparent;
  }
  .thumb .playicon::before {
    content: ''; width: 0; height: 0; border-left: 16px solid #fff; border-top: 10px solid transparent; border-bottom: 10px solid transparent;
    opacity: 0; transition: opacity .15s;
  }
  .card:hover .thumb .playicon { background: rgba(0,0,0,.25); }
  .card:hover .thumb .playicon::before { opacity: 1; }
  .dur {
    position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.8); color: #fff;
    font-size: 12px; padding: 2px 5px; border-radius: 4px;
  }
  .meta { display: flex; gap: 12px; padding-top: 10px; }
  .mini-avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
  .info .title { font-size: 15px; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .info .ch { margin-top: 6px; font-size: 13px; color: #aaa; }
  .info .stats { font-size: 13px; color: #aaa; margin-top: 2px; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #f1f1f1; color: #0f0f0f; padding: 12px 18px; border-radius: 4px; font-size: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,.5); display: none; z-index: 99;
  }
  @media (max-width: 700px) { .header-icons, .mic-btn { display: none; } main { padding: 0 12px 40px; } }
</style>
</head>
<body>

<header>
  <button class="menu-btn">&#9776;</button>
  <div class="logo">
    <div class="play"></div>
    <span>YouTube</span>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <input id="q" type="text" placeholder="Buscar" autocomplete="off" autofocus>
      <button class="search-btn" id="sb" title="Buscar">&#128269;</button>
    </div>
    <button class="mic-btn" title="Buscar por voz">&#127908;</button>
  </div>
  <div class="header-icons">
    <span>&#128249;</span>
    <span>&#128276;</span>
    <div class="avatar">M</div>
  </div>
</header>

<div class="chips">
  <span class="chip active">Todo</span>
  <span class="chip">Videojuegos</span>
  <span class="chip">Música</span>
  <span class="chip">En directo</span>
  <span class="chip">Mixes</span>
  <span class="chip">Juegos de acción</span>
  <span class="chip">Coches</span>
  <span class="chip">Hip-hop</span>
  <span class="chip">Trailers</span>
</div>

<main>
  <h2 id="results-info" style="font-size:18px;font-weight:600;margin:8px 0 20px;color:#f1f1f1;display:none;"></h2>
  <div class="grid" id="grid"></div>
</main>

<div id="toast"></div>

<script>
(function () {
  var input = document.getElementById('q');
  var grid = document.getElementById('grid');
  var resultsInfo = document.getElementById('results-info');

  var FAKE = [
    { t: 'GTA Vice City - Trailer Oficial en Español', ch: 'Rockstar Games', v: '38 M de visualizaciones', d: 'hace 20 años', len: '1:48', c1: '#3a1c71', c2: '#d76d77' },
    { t: 'Top 10 Trucos de GTA: Vice City que NO conocías', ch: 'TrucosGTA', v: '5,2 M de visualizaciones', d: 'hace 1 año', len: '12:33', c1: '#134e5e', c2: '#71b280' },
    { t: 'Música de los 80 para conducir por Vice City', ch: 'RetroWave FM', v: '12 M de visualizaciones', d: 'hace 3 años', len: '52:11', c1: '#ff512f', c2: '#dd2476' },
    { t: 'Speedrun de GTA Vice City en 42:58', ch: 'Speedrunners', v: '1,8 M de visualizaciones', d: 'hace 2 semanas', len: '42:58', c1: '#0f2027', c2: '#2c5364' },
    { t: 'Cómo completar la misión del helicóptero', ch: 'GuíasGamer', v: '890 K de visualizaciones', d: 'hace 6 meses', len: '9:47', c1: '#b24592', c2: '#f15f79' },
    { t: 'Todas las emisoras de Vice City en un solo vídeo', ch: 'Radio VCPR', v: '2,3 M de visualizaciones', d: 'hace 8 meses', len: '1:14:05', c1: '#00b09b', c2: '#96c93d' },
    { t: 'El Topo - 100% infiltración sin ser detectado', ch: 'Stealth Pro', v: '640 K de visualizaciones', d: 'hace 3 meses', len: '14:22', c1: '#457fca', c2: '#5691c8' },
    { t: 'Los coches más rápidos y dónde encontrarlos', ch: 'CarrosVC', v: '1,1 M de visualizaciones', d: 'hace 5 meses', len: '10:05', c1: '#f953c6', c2: '#b91d73' },
    { t: 'Historia real de Grand Theft Auto Vice City', ch: 'Documentales Game', v: '760 K de visualizaciones', d: 'hace 10 meses', len: '25:42', c1: '#1a2a6c', c2: '#b21f1f' },
    { t: 'Poster de GTA VI falso en la playa de Miami', ch: 'NoticiasVC', v: '309 K de visualizaciones', d: 'hace 4 días', len: '3:11', c1: '#41295a', c2: '#2f0743' }
  ];

  function hueOf(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
    return h;
  }
  function thumb(clr, q) {
    return 'linear-gradient(' + clr[0] + ', ' + clr[1] + ')';
  }
  function card(item) {
    var hue = hueOf(item.t);
    var el = document.createElement('div');
    el.className = 'card';
    el.innerHTML =
      '<div class="thumb" style="background:' + thumb([item.c1, item.c2], item.t) + '">' +
        '<div class="playicon"></div>' +
        '<span class="dur">' + item.len + '</span>' +
      '</div>' +
      '<div class="meta">' +
        '<div class="mini-avatar" style="background:' + thumb(item.t, item.c2, item.c1) + '"></div>' +
        '<div class="info">' +
          '<div class="title">' + item.t + '</div>' +
          '<div class="ch">' + item.ch + '</div>' +
          '<div class="stats">' + item.v + ' &middot; ' + item.d + '</div>' +
        '</div>' +
      '</div>';
    return el;
  }

  function render(list) {
    grid.innerHTML = '';
    list.forEach(function (it) { grid.appendChild(card(it)); });
  }

  function randomResults(q) {
    var titles = [
      q + ' - Remix 2026', q + ' gameplay sin cortes', q + ' explicado', q + ' Beta',
      q + ' en directo', q + ' (subtitulado)', 'Lo mejor de ' + q, q + ' versión original'
    ];
    var out = [];
    for (var i = 0; i < 12; i++) {
      var t = titles[Math.floor(Math.random() * titles.length)];
      var h = Math.floor(Math.random() * 360);
      out.push({
        t: t,
        ch: ['ChanelProds', 'GamerZone', 'RetroPlay', 'UltraHD', 'ViceCityClips'][Math.floor(Math.random() * 5)],
        v: (Math.floor(Math.random() * 90) + 3) + ' K de visualizaciones',
        d: 'hace ' + (Math.floor(Math.random() * 354) + 1) + ' días',
        len: (Math.floor(Math.random() * 22) + 2) + ':' + String(Math.floor(Math.random() * 60)).padStart(2, '0'),
        c1: 'hsl(' + h + ', 65%, 30%)',
        c2: 'hsl(' + ((h + 60) % 360) + ', 70%, 45%)'
      });
    }
    return out;
  }

  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.display = 'block';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.style.display = 'none'; }, 2500);
  }

  async function checkKey(key) {
    try {
      var r = await fetch('/gate/auth?key=' + encodeURIComponent(key));
      return r.ok;
    } catch (e) { return false; }
  }

  async function onSearch() {
    var q = input.value.trim();
    if (!q) return;
    document.title = q + ' - Buscar - YouTube';
    resultsInfo.style.display = '';
    resultsInfo.textContent = 'Resultados de búsqueda para "' + q + '" - ¿Querías decir: ' + q + '?';

    var ok = await checkKey(q);
    if (ok) { location.href = '/'; return; }

    render(randomResults(q));
    showToast('No se encontraron resultados exactos');
  }

  document.getElementById('sb').addEventListener('click', onSearch);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') onSearch(); });

  document.querySelectorAll('.chip').forEach(function (c) {
    c.addEventListener('click', function () {
      document.querySelectorAll('.chip').forEach(function (x) { x.classList.remove('active'); });
      c.classList.add('active');
      render(FAKE.slice().reverse());
    });
  });

  render(FAKE);
})();
</script>
</body>
</html>
