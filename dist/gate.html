<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso - Grand Theft Auto: Vice City</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #f7e0c0 0%, #ff9ecb 30%, #f5457d 55%, #7a1f8c 80%, #2a0944 100%);
    font-family: "Trebuchet MS", Verdana, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    padding: 16px;
  }
  .card {
    width: 100%; max-width: 380px; background: rgba(20, 10, 35, .86);
    backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.18);
    border-radius: 18px; padding: 36px 30px 30px; color: #fff;
    box-shadow: 0 24px 70px rgba(0,0,0,.55); text-align: center;
  }
  h1 { font-size: 20px; letter-spacing: .5px; margin-bottom: 4px;
       background: linear-gradient(90deg, #ffd76a, #ff8bff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { font-size: 13px; color: #cfc0e6; margin-bottom: 26px; }
  label { display: block; text-align: left; font-size: 12px; color: #c9bde2; margin-bottom: 6px; }
  input {
    width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.08); color: #fff; font-size: 15px; outline: none; margin-bottom: 18px;
  }
  input:focus { border-color: #ff7bd5; }
  button {
    width: 100%; padding: 14px; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(90deg, #ff5e9c, #ff7de8); color: #1d0a2e; font-size: 16px; font-weight: 700;
    letter-spacing: .5px; margin-top: 2px;
  }
  button:hover { filter: brightness(1.1); }
  .hint { margin-top: 14px; font-size: 12px; color: #9b8cc0; }
  .err { margin-top: 14px; font-size: 13px; color: #ffb1b1; display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Grand Theft Auto: Vice City</h1>
    <div class="sub">Acceso privado - introduce la contraseña para jugar</div>
    <form method="get" action="/gate/auth">
      <label for="key">Contraseña</label>
      <input type="password" id="key" name="key" placeholder="••••••••" autocomplete="off" autofocus required>
      <button type="submit">Entrar y jugar</button>
    </form>
    <div class="err" id="err">Contraseña incorrecta. Inténtalo de nuevo.</div>
    <div class="hint">Si eres invitado, pide la clave al dueño.</div>
  </div>
  <script>
    if (location.search && new URLSearchParams(location.search).get("b") === "1") {
      document.getElementById('err').style.display = 'block';
    }
  </script>
</body>
</html>
